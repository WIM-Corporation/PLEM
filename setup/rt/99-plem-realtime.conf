#
# Real-time scheduling for members of the "realtime" group: SCHED_FIFO priority up to 99 and
# unlimited locked memory, so control loops (the ros2_control controller manager, the EtherCAT
# bus thread) can run real-time as a normal user. Membership takes effect at the next login.
# Managed file: the RT setup wizard overwrites local edits.
@realtime soft rtprio 99
@realtime soft memlock unlimited
@realtime hard rtprio 99
@realtime hard memlock unlimited
